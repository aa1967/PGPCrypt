[package]
name = "pgpcrypt"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An experimental offline encrypted OpenPGP vault and desktop text workspace"
default-run = "pgpcrypt-worker"

[features]
default = []
legacy-migration = ["dep:rpassword"]

[[bin]]
name = "pgpcrypt-worker"
path = "src/bin/pgpcrypt-worker.rs"

[[bin]]
name = "pgpcrypt-migrate"
path = "src/bin/pgpcrypt-migrate.rs"
required-features = ["legacy-migration"]

[dependencies]
anyhow = "1"
age = "=0.12.1"
libc = "0.2"
keepass = { version = "=0.17.0", features = ["save_kdbx4"] }
rust-argon2 = "3.0"
quick-xml = "0.42"
rpassword = { version = "7.5", optional = true }
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-openssl", "compression-deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]

[profile.dev]
debug = 0

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
panic = "abort"
