name: Debian 13 package
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install Debian build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y -t trixie-backports rustc cargo rustfmt rust-clippy
          apt-get install -y --no-install-recommends git ca-certificates build-essential pkg-config \
            libssl-dev clang libclang-dev qt6-base-dev qt6-wayland \
            python3 binutils dpkg-dev desktop-file-utils libsodium-dev libzxcvbn-dev age gnupg keepassxc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = v0.1.0-alpha11
      # These checks run on GitHub after pushing; there are no local Git hooks.
      - name: Check source
        run: |
          ./scripts/dev.sh test --locked --all-features -j 2
          ./scripts/dev.sh fmt --all -- --check
          ./scripts/dev.sh clippy --locked --all-targets --all-features -- -D warnings
      - name: Build Debian package
        run: ./scripts/build-deb.sh
      - name: Check package and container interoperability
        run: |
          python3 tests/age_interop.py
          python3 tests/kdbx_interop.py
          python3 scripts/check-deb.py dist/pgpcrypt_0.1.0.alpha11_amd64.deb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pgpcrypt-debian13-amd64
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgpcrypt-debian13-amd64
          path: dist
      - name: Attach package to public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "PGPCrypt 0.1.0 alpha11 — Debian 13 amd64" \
            --notes-file docs/releases/0.1.0-alpha11.md \
            dist/pgpcrypt_0.1.0.alpha11_amd64.deb dist/SHA256SUMS
