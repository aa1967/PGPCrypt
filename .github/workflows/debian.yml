name: Debian 13 package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install Debian build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential pkg-config \
            libssl-dev clang libclang-dev qt6-base-dev qt6-wayland rustc cargo \
            rustfmt rust-clippy python3 binutils dpkg-dev desktop-file-utils libsodium-dev age gnupg
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test and build
        run: |
          ./scripts/dev.sh test --locked --all-features -j 2
          ./scripts/dev.sh fmt --all -- --check
          ./scripts/dev.sh clippy --locked --all-targets --all-features -- -D warnings
          ./scripts/build-desktop.sh
          python3 tests/age_interop.py
          ./scripts/build-deb.sh
          python3 scripts/check-deb.py dist/pgpcrypt_0.1.0~alpha2_amd64.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgpcrypt-debian13-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
